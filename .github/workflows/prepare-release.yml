name: Prepare release

# Merging the PR this opens triggers publish-release.yml.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag WITH "v" prefix (e.g. v4.4.0, v4.4.0-beta.1)'
        required: true
        type: string

# `id-token: write` — Octopass OIDC for PR creation
permissions:
  contents: write
  id-token: write

jobs:
  create-release-pr:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/create-release-pr.yml@master
    with:
      tag: ${{ inputs.tag }}
      team: mobile

  # The reusable workflow above commits CHANGELOG.md only. This job adds the
  # podspec versions on top of it: one commit with both podspecs, pushed to the
  # very same branch the release PR is based on.
  update-podspec-versions:
    needs: [create-release-pr]
    runs-on: [team-mobile]
    permissions:
      contents: write
    steps:
      - name: Checkout the release branch
        uses: actions/checkout@v5
        with:
          ref: release-bump/${{ inputs.tag }}

      - name: Update podspec versions
        run: sh scripts/update-podspec-versions.sh "${{ inputs.tag }}"

      - name: Commit and push
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "Podspec versions are already up to date"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.podspec'
          git commit -m "chore: update podspec versions to ${{ inputs.tag }}"
          git push
