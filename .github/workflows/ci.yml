name: CI

# Lints, tests and builds on pull requests and pushes to master.
#
# Work is split by what actually needs macOS. SwiftLint and swift-format have
# purpose-built reusable workflows that run in Docker on a Linux team runner,
# and the JS half needs nothing but Node — so only the Swift toolchain and
# WebKit tests occupy a scarce ephemeral-mac VM.

on:
  pull_request:
  push:
    branches: [master]

# kv-get is an unauthenticated fetch and every job only reads the repo,
# so no OIDC token is needed here.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Image tags must be exact, never :latest, so the current one is resolved
  # from the KV store at the start of every run.
  resolve-runner:
    runs-on: [team-mobile]
    outputs:
      macos: ${{ steps.kv.outputs.value }}
    steps:
      - uses: AdGuardSoftwareLimited/actions/actions/kv-get@master
        id: kv
        with:
          key: build-images/macos

  # The repo's own pre-commit hook warns about these; this enforces it in CI.
  check-fixme:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/check-fixme.yml@master
    with:
      team: mobile
      # scripts/hooks/pre-commit greps for the same keyword this check looks
      # for, so its own source always matches; the hook excludes itself too.
      # Do not spell that keyword out here — this file is scanned as well.
      check-fixme-exclude: |
        pre-commit

  # make swiftlint-lint — runs --strict, reads .swiftlint.yml from the root.
  swiftlint:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/lint-swiftlint.yml@master
    with:
      team: mobile

  # make swiftformat-lint — runs --strict, reads .swift-format from the root.
  swiftformat:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/lint-swiftformat.yml@master
    with:
      team: mobile

  # markdownlint, ESLint, vitest and the package build: Node only, no macOS.
  js:
    runs-on: team-mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Pinned to the major version the lockfile and the macOS image use.
      # pnpm 11+ turns ignored dependency build scripts into a hard error.
      - name: Install pnpm
        run: npm install --global pnpm@10

      # The team runner has no `make`, so the steps below mirror the md-lint
      # and js-* Makefile targets directly, sharing this one install.
      - name: Install dependencies
        run: pnpm -C ./Extension install

      # `make codegen` writes the release version into package.json and into
      # ContentBlockerConverterVersion.swift, but create-release-pr only rolls
      # the changelog over. Without this gate a forgotten codegen would ship an
      # npm package under the previous version.
      - name: Check version consistency
        run: |
          set -euo pipefail
          changelog=$(grep -m1 -oE '^## \[[0-9][^]]*\]' CHANGELOG.md | sed 's/^## \[//; s/\]$//')
          package=$(grep -m1 -oE '"version": *"[^"]+"' Extension/package.json | cut -d'"' -f4)
          swift=$(grep -m1 -oE 'library = "[^"]+"' \
            Sources/ContentBlockerConverter/ContentBlockerConverterVersion.swift | cut -d'"' -f2)
          echo "CHANGELOG.md=$changelog package.json=$package generated=$swift"
          if [ "$changelog" != "$package" ] || [ "$changelog" != "$swift" ]; then
            echo "::error::Version mismatch. Run 'make codegen' and commit the result."
            exit 1
          fi

      - name: Lint markdown
        run: ./Extension/node_modules/.bin/markdownlint .

      - name: Lint JS
        run: pnpm -C ./Extension lint

      - name: Test JS
        run: CI=1 pnpm -C ./Extension test

      - name: Build JS
        run: pnpm -C ./Extension build

  # Dead-code analysis needs an index store, so it stays on macOS.
  periphery:
    needs: [resolve-runner]
    runs-on:
      - ephemeral
      - ephemeral-mac
      - ${{ needs.resolve-runner.outputs.macos }}
      - ephemeral-limit-memory-8192
      - ephemeral-limit-cpu-4
      - ephemeral-limit-disk-gb-40
    steps:
      - uses: actions/checkout@v5
      - name: Check tooling
        run: make tools
      - name: Periphery scan
        run: make periphery-lint

  # Swift tests and build. make test also covers webkit-test, so there is no
  # separate WebKit job: with a single macOS image it would be pure duplication.
  # js-test is excluded here because the js job above already ran it.
  swift:
    needs: [resolve-runner]
    runs-on:
      - ephemeral
      - ephemeral-mac
      - ${{ needs.resolve-runner.outputs.macos }}
      - ephemeral-limit-memory-8192
      - ephemeral-limit-cpu-4
      - ephemeral-limit-disk-gb-40
    steps:
      - uses: actions/checkout@v5

      # webkit-test prints the WebKit version itself.
      - name: Swift tests
        run: make swift-test webkit-test filelock-test command-line-wrapper-test

      - name: Swift build
        run: make swift-build
