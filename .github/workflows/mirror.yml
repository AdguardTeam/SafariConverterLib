name: Mirror

on:
  push:
    branches:
      - master

# `actions: write` — disable workflows in the public mirror
# `id-token: write` — Octopass token for push to public repo
permissions:
  contents: read
  actions: write
  id-token: write

jobs:
  mirror:
    uses: AdGuardSoftwareLimited/actions/.github/workflows/mirror.yml@master
    with:
      team: mobile
      target_repo: git@github.com:AdguardTeam/SafariConverterLib.git
    secrets: inherit
